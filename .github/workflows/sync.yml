name: sync to Hugging Face Hub
on:
    push:
        branches: [main]
    workflow_dispatch:
jobs:
    sync-to-hub:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0
                  lfs: True

            - name: Push to Hub
              env:
                HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                git remote add space https://USERNAME:${HF_TOKEN}@huggingface.co/spaces/RajeevK-0/AI-ML-research-assistant
                git push --force space main